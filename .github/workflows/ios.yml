name: iOS build

# Compiles the iOS app on a Mac runner so iOS breakage shows up on every
# pull request. The build is unsigned; signing needs the owner's Apple
# Developer account and happens when publishing.
on:
  pull_request:
    paths:
      - 'fadl_app/**'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'fadl_app/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: fadl_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build ios --release --no-codesign
      - name: Check the widget and adhan clips are in the app
        run: |
          app=build/ios/iphoneos/Runner.app
          test -f "$app/PlugIns/PrayerWidgetExtension.appex/PrayerWidgetExtension"
          plutil -extract NSExtension.NSExtensionPointIdentifier raw \
            "$app/PlugIns/PrayerWidgetExtension.appex/Info.plist" | grep -qx com.apple.widgetkit-extension
          for raw in android/app/src/main/res/raw/adhan_*.ogg; do
            test -f "$app/$(basename "$raw" .ogg).caf"
          done
          ls -la "$app/PlugIns"
      - name: Package unsigned app
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa && zip -qr fadl-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: fadl-ios-unsigned
          path: fadl_app/build/ios/ipa/fadl-unsigned.ipa
          retention-days: 14
