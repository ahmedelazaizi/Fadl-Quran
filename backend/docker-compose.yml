services:
  db:
    image: postgres:17-alpine
    container_name: fadl-db
    environment:
      POSTGRES_USER: fadl
      POSTGRES_PASSWORD: fadl
      POSTGRES_DB: fadl
    ports:
      - "5433:5432"
    volumes:
      - fadl-db-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fadl -d fadl"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fadl-db-data:
